# Referência da configuração do serviço `orbien-api` no Render.
#
# ATENÇÃO: o serviço em produção foi criado pelo dashboard e é gerenciado por
# lá — este arquivo NÃO é aplicado automaticamente. Ele documenta a
# configuração e permite adoção via Blueprint no futuro (Blueprints exigem
# render.yaml na raiz do repositório, que é onde este arquivo está).
#
# O serviço roda com runtime Node, não Docker. O Dockerfile em
# apps/api/Dockerfile continua válido para build local e para um eventual
# host de containers, mas não é o que o Render executa.

services:
  - type: web
    name: orbien-api
    runtime: node
    plan: free
    branch: main
    healthCheckPath: /api/health

    # --include=dev é obrigatório: NODE_ENV=production (abaixo) faz o npm
    # omitir devDependencies, e o build precisa de turbo, nest e typescript.
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: node apps/api/dist/src/main.js

    # Evita redeploy da API quando o commit só toca site/web.
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
        - turbo.json

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromGroup: orbien-secrets
      - key: DIRECT_URL
        fromGroup: orbien-secrets
      - key: JWT_SECRET
        fromGroup: orbien-secrets
      - key: JWT_REFRESH_SECRET
        fromGroup: orbien-secrets
      - key: ONESIGNAL_APP_ID
        fromGroup: orbien-secrets
      - key: ONESIGNAL_API_KEY
        fromGroup: orbien-secrets
      - key: ASAAS_API_KEY
        fromGroup: orbien-secrets
      - key: ASAAS_WEBHOOK_SECRET
        fromGroup: orbien-secrets
      - key: R2_ACCOUNT_ID
        fromGroup: orbien-secrets
      - key: R2_ACCESS_KEY_ID
        fromGroup: orbien-secrets
      - key: R2_SECRET_ACCESS_KEY
        fromGroup: orbien-secrets
      - key: R2_BUCKET_NAME
        fromGroup: orbien-secrets
      - key: R2_PUBLIC_URL
        fromGroup: orbien-secrets
      - key: ALLOWED_ORIGINS
        value: "https://web.useorbien.com.br,http://localhost:3001"
      - key: RESEND_API_KEY
        fromGroup: orbien-secrets
      - key: MAIL_FROM
        value: "Orbien <naoresponda@useorbien.com>"
      - key: FRONTEND_URL
        value: "https://web.useorbien.com.br"
