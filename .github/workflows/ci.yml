name: CI

# Racional, alternativas consideradas e o que deliberadamente ficou de fora:
# docs/CI.md
#
# Nenhum portão de teste precisa de secret — o único do arquivo é o EXPO_TOKEN
# do build EAS, lá embaixo. O banco dos jobs locais é um Postgres descartável
# provisionado por apps/api/scripts/bootstrap-db.sh, e as credenciais saem do
# seed do próprio repositório. O `e2e-prod` roda contra o ambiente no ar, mas
# com a conta de um tenant que existe só para teste e cuja senha é pública — a
# proteção ali não é o sigilo da senha, é o fato de a conta não alcançar dado
# de ninguém.
#
# Ainda assim `e2e-prod` se pula em PR de fork: escrever no ambiente real a
# partir de código que ninguém revisou é outra conversa, independente de secret.
#
# Tudo que é teste — aqui, no e2e local e na mão — usa `teste1-church` ou
# `teste2-church`, nunca o tenant de uma igreja real. Ver docs/AMBIENTES.md.
#
# `turbo run <task>` sem --filter cobre todos os workspaces: apps novos entram
# nos portões de build, lint e test sem editar este arquivo. O que precisa ser
# adicionado à mão é só a cobertura, que é medida app por app.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fase 1 — build, tipos e lint ─────────────────────────────────────────
  build:
    name: Build, tipos e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # --include=dev é explícito de propósito: se algum dia este job definir
      # NODE_ENV=production, o npm omite devDependencies e o build morre por
      # falta de turbo, nest e typescript. Foi o que quebrou o primeiro deploy.
      - run: npm ci --include=dev

      - name: Sanidade das skills
        run: node scripts/check-skills.mjs

      - name: Build dos 5 apps
        run: npx turbo run build

      # nest build não checa a pasta test/, e é lá que estão os testes de RLS.
      - name: Tipos da API, incluindo os testes
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Lint
        run: npx turbo run lint

  # ── Testes de unidade e cobertura — sem banco, roda em paralelo ──────────
  # Nenhum passo aqui precisa de Postgres: a suíte `unit` da API usa Prisma
  # mockado, e web/site rodam em jsdom. O que precisa de banco está nos jobs
  # `rls` e `e2e`. Ver docs/TESTES.md.
  unit:
    name: Unidade e cobertura
    runs-on: ubuntu-latest
    # Postgres aqui porque `test:cov` da API roda os projetos `unit` E
    # `integration`, e o `integration` existe justamente para exercitar o app
    # contra um banco de verdade. Ficou sem serviço até 2026-09-03 só porque
    # não havia nenhum teste de integração — o primeiro a entrar
    # (impersonation.spec.ts) derrubou este job.
    #
    # A alternativa era tirar o `integration` do `test:cov`, e ela é pior: o
    # que esses testes cobrem em `src/` sairia da conta da meta de 100%,
    # baixando o número medido sem baixar o risco.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: orbien
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/orbien
      DATABASE_URL: postgresql://orbien_app:ci_app@localhost:5432/orbien
      # A suíte de integração sobe o AppModule, que exige estes no boot.
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --include=dev

      # `turbo run test` depende de ^build por causa do Prisma Client: sem
      # `prisma generate`, os imports de @prisma/client não resolvem.
      - name: Suítes de unidade dos 5 apps
        run: npx turbo run test

      # Sem --seed: a suíte de integração monta as próprias fixtures e as
      # remove. Dado de seed aqui só criaria acoplamento.
      - name: Provisionar o banco para a suíte de integração
        run: ORBIEN_APP_PASSWORD=ci_app bash scripts/bootstrap-db.sh
        working-directory: apps/api

      # Um passo por app — app sem passo é app sem portão, que foi o estado
      # do mobile entre 2026-09-08 e 2026-09-10. Cada um reprova sozinho
      # quando cai abaixo do piso do seu próprio arquivo de config; os pisos
      # e o porquê de cada um estão em docs/TESTES.md.
      #
      # API e site fecham em `global: 100`. Admin (99/98/100/100, medido na
      # Fase 14), mobile (99/97/98/99) e web (99/97/99/99, global somado aos
      # pisos por caminho), os dois medidos em 2026-09-25, travam o piso
      # medido — todos acima da meta de 96% — e o piso nunca desce.
      - name: Cobertura da API
        run: npm run test:cov -w orbien-backend

      - name: Cobertura do web
        run: npm run test:cov -w orbien-web

      - name: Cobertura do site
        run: npm run test:cov -w orbien-site

      - name: Cobertura do admin
        run: npm run test:cov -w orbien-admin

      - name: Cobertura do mobile
        run: npm run test:cov -w orbien-mobile

  # ── Fase 2 — isolamento multi-tenant contra Postgres efêmero ─────────────
  rls:
    name: Testes de RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        # 16+ é requisito: bootstrap-db.sh usa GRANT ... WITH SET TRUE.
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: orbien
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/orbien
      # orbien_app, não postgres: rodar como superusuário passaria por cima do
      # RLS e os testes passariam sem testar nada.
      DATABASE_URL: postgresql://orbien_app:ci_app@localhost:5432/orbien
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --include=dev

      - name: Provisionar o banco
        run: ORBIEN_APP_PASSWORD=ci_app bash scripts/bootstrap-db.sh
        working-directory: apps/api

      # test/setup.ts carrega .env via dotenv, que aqui não existe. Não é
      # problema: arquivo ausente não lança, e variável de ambiente tem
      # precedência sobre o arquivo.
      - name: Suíte de isolamento
        run: npm run test:rls -w orbien-backend

  # ── Fase 13 — smoke do site: sem banco, sem API ──────────────────────────
  #
  # Job separado do `e2e` de propósito. O site é estático: não fala com a API,
  # não tem banco, não tem sessão. Pendurá-lo no job do web faria o smoke
  # esperar o Postgres subir e a API acordar para verificar páginas que não
  # dependem de nenhum dos dois — e, pior, ficaria vermelho por falha alheia a
  # ele. Assim roda em paralelo e em menos de um minuto.
  smoke-site:
    name: Smoke do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --include=dev

      - name: Build do site
        run: npx turbo run build --filter=orbien-site

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Subir o site
        run: |
          npm run start -w orbien-site -- --port 3002 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3002/ >/dev/null && exit 0
            sleep 2
          done
          echo "site não respondeu em 120s"; exit 1

      - name: Smoke
        env:
          E2E_BASE_URL: http://localhost:3002
        run: npm run e2e -w orbien-site

      - name: Relatório e traces quando falhar
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-site
          path: |
            apps/site/playwright-report/
            apps/site/test-results/
          retention-days: 7

  # ── Fase 3 — e2e autocontido: API e web sobem no próprio runner ──────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: orbien
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/orbien
      DATABASE_URL: postgresql://orbien_app:ci_app@localhost:5432/orbien
      # O browser chama /api-proxy no próprio web; o rewrite do next.config
      # encaminha para cá. Precisa estar definido no build E no start.
      API_BACKEND_URL: http://localhost:3000/api
      NEXT_PUBLIC_API_URL: /api-proxy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --include=dev

      - name: Provisionar o banco com dados de seed
        run: ORBIEN_APP_PASSWORD=ci_app bash scripts/bootstrap-db.sh --seed
        working-directory: apps/api

      - name: Build da API e do web
        run: npx turbo run build --filter=orbien-backend --filter=orbien-web

      - name: Chromium
        run: npx playwright install --with-deps chromium

      # Conjunto mínimo verificado para a API subir: sem estes ela morre no
      # boot; as integrações externas (R2, Resend, OneSignal) não são exigidas.
      - name: Subir a API
        env:
          PORT: '3000'
          JWT_SECRET: ci-jwt-secret
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret
          ALLOWED_ORIGINS: http://localhost:3001
          FRONTEND_URL: http://localhost:3001
        run: |
          node apps/api/dist/src/main.js &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health >/dev/null && exit 0
            sleep 2
          done
          echo "API não respondeu em 120s"; exit 1

      - name: Subir o web
        run: |
          npm run start -w orbien-web -- --port 3001 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/login >/dev/null && exit 0
            sleep 2
          done
          echo "web não respondeu em 120s"; exit 1

      # As credenciais saem do seed do repositório — não são segredo. O usuário
      # precisa ser o tenant_admin: platform_support leva 403 na maioria das
      # rotas.
      #
      # E2E_API_URL vai direto na API, não em /api-proxy: as fixtures (e
      # suporte.spec.ts) montam e desmontam dados com fetch() cru, fora do
      # browser, e anexam o Bearer na mão. Desde que o proxy virou Route
      # Handler (sessão em cookie HttpOnly), ele ignora Authorization de
      # entrada e só repassa o token que lê do cookie — que essas chamadas não
      # têm. Passar por ali agora rende 401 em qualquer GET/POST de apoio; só
      # a `page` (fixture do Playwright) precisa do proxy, porque é ela quem
      # de fato navega pelo browser com o cookie semeado.
      - name: Suíte de e2e
        env:
          E2E_BASE_URL: http://localhost:3001
          E2E_API_URL: http://localhost:3000/api
          # `teste1-church`, nunca `doca-church`: nenhum teste roda sobre o
          # tenant de uma igreja de verdade, nem aqui, onde o banco é
          # descartável. A regra está em `docs/AMBIENTES.md` e vale para todo
          # ambiente — é justamente por ela existir em todo ambiente que ela
          # também vale aqui.
          E2E_EMAIL: fvargaspf+teste1@gmail.com
          E2E_PASSWORD: A3dodfemf
          E2E_TENANT: teste1-church
          # A conta de plataforma do seed. `suporte.spec.ts` precisa dela para
          # montar o handoff de verdade (login de plataforma → listar tenants →
          # impersonate); sem estas duas o spec se pula em vez de falhar.
          E2E_SUPPORT_EMAIL: fernando.vargas@fill.tech
          E2E_SUPPORT_PASSWORD: A3dodfemf
        run: npm run e2e -w orbien-web

      # É o que transforma "quebrou no CI" em diagnóstico de dois minutos.
      - name: Relatório e traces quando falhar
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/e2e/screenshots/
          retention-days: 7

  # ── Fase 3b — e2e contra PRODUÇÃO ────────────────────────────────────────
  #
  # Mesma suíte do job acima, apontada para o ambiente real. Não substitui o
  # `e2e`: aquele prova a suíte contra um banco limpo e determinístico, este
  # prova que o que está no ar responde. Por isso os dois rodam.
  #
  # **Escreve em produção.** As fixtures criam e removem celebração, instância
  # e template de verdade via API, e `suporte.spec.ts` faz login de plataforma
  # e impersonate, o que grava em `audit_logs`. Isso é aceitável porque o alvo
  # é `teste1-church` — tenant que existe só para isso. Apontar este job para
  # qualquer outro tenant é o que `docs/AMBIENTES.md` proíbe.
  #
  # `needs: [e2e]` é de propósito: se a suíte já falha contra o banco limpo, o
  # problema é dela, e não vale sujar produção para redescobrir isso.
  #
  # O `if` pula PR de fork em vez de falhar vermelho: o GitHub não entrega
  # secret para fork, e sem as credenciais o job morreria no login com uma
  # mensagem que não ajuda ninguém.
  e2e-prod:
    name: E2E (produção)
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --include=dev

      - name: Chromium
        run: npx playwright install --with-deps chromium

      # E2E_API_URL vai direto na API, não em `/api-proxy`: as fixtures montam
      # e desmontam dados com fetch() cru, fora do browser, e anexam o Bearer
      # na mão. Desde que o proxy virou Route Handler (sessão em cookie
      # HttpOnly), ele ignora Authorization de entrada e só repassa o token que
      # lê do cookie — que essas chamadas não têm. Só a fixture `page` precisa
      # do proxy, porque é ela quem navega pelo browser com o cookie semeado.
      - name: Suíte de e2e contra produção
        env:
          E2E_BASE_URL: https://web.useorbien.com
          E2E_API_URL: https://orbien-api.onrender.com/api
          # Credencial em texto claro, e de propósito: esta conta existe só
          # para o e2e, só no `teste1-church`, e a senha é a mesma do
          # `provisionar-tenants-teste.sh`. Tratá-la como segredo daria a
          # impressão errada de que há algo a proteger aqui — o que protege é
          # o fato de a conta não alcançar dado de ninguém.
          #
          # O contrato é esse, e só vale enquanto ele for verdade: se um dia
          # esta conta ganhar acesso a tenant real, a senha sai daqui no mesmo
          # commit. Ver docs/AMBIENTES.md §5.
          E2E_EMAIL: fvargaspf+teste1@gmail.com
          E2E_PASSWORD: orbien-e2e-publica-2026
          E2E_TENANT: teste1-church
          # `E2E_SUPPORT_*` NÃO entram aqui. Elas são a conta de plataforma —
          # a que impersona em qualquer tenant — e publicá-las num repositório
          # público entregaria o produto inteiro, não um tenant de teste. Sem
          # elas o `suporte.spec.ts` se pula (test.skip), que é o custo
          # aceito: um spec a menos contra produção. Quem quiser esse spec
          # aqui cadastra os dois como secret; o resto da suíte não depende.
        run: npm run e2e -w orbien-web

      - name: Relatório e traces quando falhar
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-prod
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/e2e/screenshots/
          retention-days: 7

  # ── Build/update de preview do mobile na EAS ─────────────────────────────
  # Só na main (não em todo PR — cada build consome cota da conta EAS) e só
  # quando o diff toca apps/mobile — `needs` já garante lint/build/test
  # (turbo run test cobre o Jest do orbien-mobile) verdes antes de subir algo
  # pra nuvem da Expo. `--no-wait` porque o build em si roda assíncrono do
  # lado da Expo (10-20min) — o runner não precisa esperar; o progresso e o
  # link de instalação ficam em expo.dev/accounts/fernandovargas/projects/orbien.
  #
  # Dentro de "mudou algo em apps/mobile" há uma segunda divisão: só binário
  # nativo (dependência nativa nova, identidade/plugin em app.config.js,
  # ícones, eas.json) precisa de `eas build` — o resto é JS puro e viaja por
  # OTA via `eas update`, que não consome a cota de build (30 iOS/mês no
  # plano Free, ver e-mail de aviso da Expo de 2026-09-21). expo-updates e
  # runtimeVersion.policy="appVersion" já estão configurados em
  # app.config.js justamente para isso. Ver docs/CI.md, Fase 6.
  mobile-eas-build:
    name: Build/update EAS (mobile preview)
    runs-on: ubuntu-latest
    needs: [build, unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # git diff --quiet sai 0 (sem diff), 1 (tem diff) ou >1 (erro — ex.:
      # github.event.before inalcançável após um push que reescreve
      # histórico na main). Só o "else" de um if/else trata >1 como diff
      # (changed=true), o que dispararia build para todo push nesse cenário.
      # Por isso o código é checado explicitamente.
      - name: Mudou algo em apps/mobile?
        id: filter
        run: |
          set +e
          git diff --quiet "${{ github.event.before }}" "${{ github.event.after }}" -- apps/mobile
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "git diff falhou (rc=$rc) comparando ${{ github.event.before }}..${{ github.event.after }}" >&2
            exit 1
          fi

      # Mesma lógica de código de saída do passo acima, mas restrita aos
      # caminhos que afetam o binário. package.json entra pelo todo (não só
      # `dependencies`) de propósito: separar "mudou versão nativa" de
      # "mudou script" no diff bruto exigiria parsear JSON em shell, e o
      # custo de tratar um bump de devDependency como nativo (um build a
      # mais, ocasionalmente) é menor que o de perder uma dependência nativa
      # real por engano (update que não builda o módulo novo).
      - name: Mudou algo nativo em apps/mobile?
        id: native
        if: steps.filter.outputs.changed == 'true'
        run: |
          set +e
          git diff --quiet "${{ github.event.before }}" "${{ github.event.after }}" -- \
            apps/mobile/package.json \
            apps/mobile/app.config.js \
            apps/mobile/app.config.test.js \
            apps/mobile/eas.json \
            apps/mobile/assets
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "native=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "git diff falhou (rc=$rc) comparando ${{ github.event.before }}..${{ github.event.after }}" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        if: steps.filter.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --include=dev
        if: steps.filter.outputs.changed == 'true'

      # EXPO_TOKEN autentica não-interativo; projectId já está em
      # app.config.js (extra.eas), então não precisa de `eas init` aqui.
      - name: Disparar build (Android, profile preview)
        if: steps.filter.outputs.changed == 'true' && steps.native.outputs.native == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile preview --non-interactive --no-wait

      # Build de Simulador iOS — não assinado, sem conta Apple Developer
      # envolvida (profile preview-ios-simulator, ios.simulator=true em
      # eas.json). Só roda no Simulador do Xcode, não em iPhone físico —
      # isso exigiria credenciais Apple (ver eas.json/README quando/se
      # entrar ad-hoc ou TestFlight).
      - name: Disparar build (iOS, Simulador)
        if: steps.filter.outputs.changed == 'true' && steps.native.outputs.native == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform ios --profile preview-ios-simulator --non-interactive --no-wait

      # Mudança JS-only: publica OTA no branch/channel "preview" em vez de
      # buildar binário novo. Pressupõe que o branch "preview" já foi ligado
      # ao channel "preview" uma vez (`eas channel:edit preview --branch
      # preview`, fora do CI) — sem esse vínculo o update sobe mas nenhum
      # app instalado o recebe.
      #
      # ORBIEN_API_URL/ORBIEN_WEB_URL têm que ser os MESMOS valores dos
      # profiles `preview`/`preview-ios-simulator` em eas.json: `eas update`
      # reavalia app.config.js com o ambiente deste job, não com o `env` do
      # profile de build — sem essas duas linhas, extra.apiUrl cai no
      # default de app.config.js (http://localhost:3000) e todo app no
      # channel preview passa a tentar falar com localhost depois do OTA
      # (achado de 2026-09-23: login não batia na API, sem log nenhuma
      # tentativa, porque a requisição nem saía do device).
      - name: Publicar update OTA (Android + iOS, branch preview)
        if: steps.filter.outputs.changed == 'true' && steps.native.outputs.native == 'false'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ORBIEN_API_URL: https://orbien-api.onrender.com/api
          ORBIEN_WEB_URL: https://web.useorbien.com
        run: npx eas-cli update --branch preview --message "${{ github.sha }}" --non-interactive
